name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7224fb&color_dots=#ece8f8,#b895ff,#ff8ad8,#7224fb,#4b0fce
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff8ad8&color_dots=#150c33,#4b0fce,#7224fb,#b895ff,#7df9ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
